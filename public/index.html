<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微信公众号排版</title>
<style>
  :root {
    --bg: #f2f4f7;
    --panel: #ffffff;
    --border: #e3e6ea;
    --border-soft: #eef1f5;
    --text: #1f2329;
    --muted: #6b7280;
    --accent: #3b6ef6;
    --accent-soft: #eef3ff;
    --radius: 8px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }

  /* ---------- 菜单栏 ---------- */
  .menubar {
    flex: none; display: flex; align-items: center; gap: 14px;
    height: 46px; padding: 0 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: relative; z-index: 20;
  }
  .brand { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .brand span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 7px; }

  .menus { display: flex; align-items: center; gap: 1px; position: relative; }
  .menu { position: relative; }
  .menu-trigger {
    border: none; background: transparent; cursor: pointer;
    padding: 6px 11px; border-radius: 6px; font-size: 13.5px; color: #3c4450;
    white-space: nowrap;
  }
  .menu-trigger:hover { background: #f2f4f8; }
  .menu.open .menu-trigger { background: var(--accent); color: #fff; }

  .menu-panel {
    display: none; position: absolute; top: calc(100% + 6px); left: 0;
    min-width: 232px; padding: 6px;
    max-height: calc(100vh - 96px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 12px 32px rgba(16,24,40,.14);
  }
  .menu.open .menu-panel { display: block; }
  .menu-panel.wide { min-width: 268px; }

  .menu-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 7px 10px; border: none; background: transparent; cursor: pointer;
    border-radius: 6px; font-size: 13.5px; text-align: left; color: #2c3440;
  }
  .menu-item:hover { background: var(--accent-soft); color: #1b4dd8; }
  .menu-item .shortcut { margin-left: auto; color: var(--muted); font-size: 12px; letter-spacing: .5px; }
  .menu-item .check { width: 14px; color: var(--accent); font-size: 12px; }
  .menu-sep { height: 1px; margin: 5px 8px; background: var(--border-soft); }
  .menu-label {
    padding: 7px 10px 3px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .6px;
  }

  .menu-fields { display: grid; gap: 9px; padding: 6px 10px 10px; }
  .menu-fields .field { display: flex; align-items: center; gap: 10px; }
  .menu-fields .field label { flex: none; width: 62px; color: var(--muted); font-size: 12.5px; }
  .menu-fields select {
    flex: 1; min-width: 0; padding: 5px 8px; font: inherit; font-size: 13px;
    color: inherit; background: #fff;
    border: 1px solid var(--border); border-radius: 6px; outline: none;
  }
  .menu-fields select:focus { border-color: var(--accent); }

  .actions { margin-left: auto; display: flex; gap: 8px; flex: none; }
  .actions button {
    padding: 6px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .actions button:hover { background: #f3f5f8; }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .actions button.primary:hover { background: #2f5fe0; }
  button:disabled { opacity: .55; cursor: not-allowed; }

  /* ---------- 主体 ---------- */
  .split { flex: 1; display: grid; grid-template-columns: 1fr 6px 1fr; min-height: 0; }
  .divider { cursor: col-resize; background: var(--border); }
  .divider:hover { background: var(--accent); }
  .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
  #editor { flex: 1; min-height: 0; overflow: hidden; }
  #editor .cm-editor { height: 100%; }
  .preview-wrap { flex: 1; overflow: auto; background: #eef0f3; padding: 20px 0; }
  #preview {
    display: block; width: 100%; max-width: 420px; margin: 0 auto;
    min-height: 100%; border: none; background: transparent;
  }

  /* ---------- 状态栏 ---------- */
  .statusbar {
    flex: none; display: flex; gap: 16px; align-items: center;
    padding: 6px 16px; font-size: 12px; color: var(--muted);
    background: var(--panel); border-top: 1px solid var(--border);
  }
  .statusbar .right { margin-left: 0; }
  .statusbar .spacer { margin-left: auto; }
  .statusbar b { color: #4a5361; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- 弹窗 ---------- */
  dialog {
    border: none; border-radius: 12px; padding: 0; width: min(520px, 92vw);
    box-shadow: 0 16px 48px rgba(0,0,0,.18);
    color: var(--text);
  }
  dialog.wide { width: min(680px, 94vw); }
  dialog::backdrop { background: rgba(15,18,22,.42); }
  .dlg-head { padding: 16px 20px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .dlg-body { padding: 16px 20px; display: grid; gap: 12px; max-height: 64vh; overflow: auto; }
  .dlg-body .row { display: grid; gap: 5px; }
  .dlg-body .row label { font-size: 12px; color: var(--muted); }
  .dlg-body input {
    width: 100%; padding: 6px 9px; font: inherit; color: inherit;
    border: 1px solid var(--border); border-radius: 6px; outline: none;
  }
  .dlg-body input:focus { border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .hint a { color: var(--accent); }
  .dlg-foot {
    padding: 14px 20px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .dlg-foot button {
    padding: 6px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: #fff; cursor: pointer;
  }
  .dlg-foot button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  table.doc { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.doc th, table.doc td {
    text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border-soft);
    vertical-align: top;
  }
  table.doc th { color: var(--muted); font-weight: 500; font-size: 12px; }
  table.doc code {
    font-family: var(--mono); font-size: 12px; background: #f2f4f7;
    padding: 1px 5px; border-radius: 4px; color: #c0392b;
  }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #1f2329; color: #fff; padding: 9px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .22s;
    max-width: 70vw; z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #c0392b; }
</style>
</head>

<script>
const $ = id => document.getElementById(id)
const SAMPLE = `# 把知识，写成值得读完的文章

一份内容，从清楚的结构开始。**让好的观点，被认真看见。**

## 为什么需要专门的排版

微信后台会过滤掉 \`<style>\`、\`class\`、\`id\`，只认行内 \`style\`，
而且会丢弃 \`var()\` 和 \`calc()\`。所以不能简单地把 Markdown 转成 HTML 就粘过去。

> 先把内容讲清楚，再让形式为它服务。

### 三种常见做法

1. 手工逐段点样式
2. 用浏览器插件注入
3. 服务端渲染成内联样式 HTML

- 结构清楚
- 阅读自然
- 复制即用

### 代码

行内代码 \`print("hello")\` 长这样。

\`\`\`python
def convert(markdown: str, theme: str = "default") -> str:
    """把 Markdown 转成微信可用的 HTML"""
    return init_renderer().render(markdown)
\`\`\`

### 表格

| 主题系列 | 数量 | 版式特征 |
| --- | --- | --- |
| Minimal | 8 | 无装饰，纯色文字 |
| Focus | 8 | 居中对称，双横线 |
| Elegant | 8 | 左边框递减 + 渐变 |
| Bold | 8 | 满底色圆角投影 |

---

**加粗**、*斜体*、~~删除线~~、[链接](https://mp.weixin.qq.com/) 都要正常。
`

const STORE_KEY = 'md2wechat-studio:prefs'

let currentHtml = ''
let currentPlain = ''
let timer = null
let themeMeta = {}
let editor = null

/* ---------- 提示 ---------- */
let toastTimer
function toast(message, isError) {
  const el = $('toast')
  el.textContent = message
  el.classList.toggle('error', Boolean(isError))
  el.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => el.classList.remove('show'), isError ? 5200 : 2400)
}

function setStatus(text) { $('statStatus').textContent = text }

/* ---------- 菜单栏 ---------- */
let openMenu = null
function closeMenu() {
  if (openMenu) openMenu.classList.remove('open')
  openMenu = null
}

const menus = $('menus')
menus.addEventListener('click', (event) => {
  const trigger = event.target.closest('.menu-trigger')
  if (trigger) {
    const menu = trigger.parentElement
    const wasOpen = menu === openMenu
    closeMenu()
    if (!wasOpen) { menu.classList.add('open'); openMenu = menu }
    return
  }
  const item = event.target.closest('.menu-item')
  if (item) {
    closeMenu()
    if (item.dataset.cmd) editor.exec(item.dataset.cmd)
    else if (item.dataset.action) actions[item.dataset.action]()
    else if (item.dataset.topic) showInfo(item.dataset.topic)
  }
})
for (const menu of menus.querySelectorAll('.menu')) {
  menu.addEventListener('mouseenter', () => {
    if (openMenu && openMenu !== menu) {
      closeMenu()
      menu.classList.add('open')
      openMenu = menu
    }
  })
}
document.addEventListener('click', (event) => { if (!menus.contains(event.target)) closeMenu() })
document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeMenu() })

    title: '关于',
    body: `<p class="hint">
      自建的微信公众号 Markdown 排版服务：本地编辑器实时预览，
      由服务端把 Markdown 渲染成微信后台认得的<b>全内联样式 HTML</b>，
      再复制粘贴或直接推送到公众号草稿箱。
    </p>
    <p class="hint">
      微信后台会过滤 <code>&lt;style&gt;</code>、<code>class</code>、<code>id</code>，
      并丢弃 <code>var()</code> 与 <code>calc()</code>，
      所以主题样式必须逐个内联到元素上——这也是这个服务存在的理由。
    </p>
    <p class="hint">渲染内核移植自 <code>doocs/md</code>（WTFPL），共 48 套主题。</p>`,
  },
}

function showInfo(topic) {
  const info = INFO[topic]
  if (!info) return
  $('infoTitle').textContent = info.title
  $('infoBody').innerHTML = info.body
  $('infoDialog').showModal()
}
$('btnInfoClose').addEventListener('click', () => $('infoDialog').close())

/* ---------- 文件操作 ---------- */
function currentTitle() {
  const matched = currentPlain.match(/^#\s+(.+)$/m)
  return matched ? matched[1].trim().slice(0, 64) : ''
}

const actions = {
  new() {
    const text = editor.getValue().trim()
    if (text && !window.confirm('新建会清空当前内容，确定继续？')) return
    editor.setValue('')
    editor.focus()
  },
  import() { $('fileInput').click() },
  export() {
    const blob = new Blob([editor.getValue()], { type: 'text/markdown;charset=utf-8' })
    const url = URL.createObjectURL(blob)
    const link = document.createElement('a')
    link.href = url
    link.download = `${currentTitle() || '未命名文档'}.md`
    link.click()
    URL.revokeObjectURL(url)
  },
  copy: copyToWeChat,
  draft: openDraft,
}

$('fileInput').addEventListener('change', async (event) => {
  const file = event.target.files?.[0]
  event.target.value = ''
  if (!file) return
  editor.setValue(await file.text())
  editor.focus()
  toast(`已导入 ${file.name}`)
})

/* ---------- 初始化 ---------- */
async function bootstrap() {
  const [themes, codeThemes] = await Promise.all([
    fetch('/api/themes').then(r => r.json()),
    fetch('/api/code-themes').then(r => r.json()).catch(() => ({ data: { themes: [], default: 'github' } })),
  ])

  const groups = {}
  for (const theme of themes.data.themes) {
    themeMeta[theme.name] = theme
    ;(groups[theme.series] ||= []).push(theme)
  }
  const seriesLabels = {
    basic: '基础主题', minimal: '极简系列', focus: '聚焦系列',
    elegant: '优雅系列', bold: '醒目系列', featured: '精选主题',
  }
  const themeSelect = $('theme')
  for (const [series, items] of Object.entries(groups)) {
    const group = document.createElement('optgroup')
    group.label = seriesLabels[series] || series
    for (const theme of items) {
      const option = document.createElement('option')
      option.value = theme.name
      option.textContent = theme.label
      group.appendChild(option)
    }
    themeSelect.appendChild(group)
  }

  const codeSelect = $('codeTheme')
  const followTheme = document.createElement('option')
  followTheme.value = ''
  followTheme.textContent = '跟随主题'
  codeSelect.appendChild(followTheme)
  for (const name of codeThemes.data.themes) {
    const option = document.createElement('option')
    option.value = name
    option.textContent = name
    codeSelect.appendChild(option)
  }

  const saved = restore()
  editor = window.MDEditor.mount({
    parent: $('editor'),
    doc: saved.markdown ?? SAMPLE,
    onChange: scheduleRender,
    onCursor: paintCursor,
  })
  paintCursor(editor.cursor())
  render()
}

/* ---------- 偏好持久化 ---------- */
function persist() {
  localStorage.setItem(STORE_KEY, JSON.stringify({
    markdown: editor.getValue(),
    theme: $('theme').value,
    fontSize: $('fontSize').value,
    background: $('background').value,
    codeTheme: $('codeTheme').value,
    appId: $('dAppId').value,
    author: $('dAuthor').value,
  }))
}
function restore() {
  let saved = {}
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') } catch {}
  if (saved.theme && themeMeta[saved.theme]) $('theme').value = saved.theme
  if (saved.fontSize) $('fontSize').value = saved.fontSize
  if (saved.background) $('background').value = saved.background
  if (saved.codeTheme) $('codeTheme').value = saved.codeTheme
  if (saved.appId) $('dAppId').value = saved.appId
  if (saved.author) $('dAuthor').value = saved.author
  return saved
}

/* ---------- 状态栏 ---------- */
function paintCursor({ line, column, selected }) {
  $('statCursor').innerHTML = `第 <b>${line}</b> 行，第 <b>${column}</b> 列`
  $('statSelected').textContent = selected ? `已选 ${selected} 字符` : ''
}

/* ---------- 预览 ---------- */
function scheduleRender() {
  clearTimeout(timer)
  timer = setTimeout(render, 260)
  setStatus('输入中…')
}

async function render() {
  const body = {
    markdown: editor.getValue(),
    theme: $('theme').value,
    fontSize: $('fontSize').value,
    backgroundType: $('background').value,
    codeTheme: $('codeTheme').value || undefined,
  }

  setStatus('渲染中…')
  try {
    const response = await fetch('/api/convert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })
    const payload = await response.json()
    if (payload.code !== 0) throw new Error(payload.msg)

    const data = payload.data
    currentHtml = data.html
    currentPlain = body.markdown
    paintPreview(data.html, themeMeta[data.theme])

    $('statTheme').textContent = themeMeta[data.theme]?.label ?? data.theme
    $('statWords').innerHTML = `<b>${data.wordCount}</b> 字`
    $('statRead').innerHTML = `约 <b>${data.estimatedReadTime}</b> 分钟`
    setStatus('就绪')
    persist()
  } catch (error) {
    setStatus('渲染失败')
    toast(`渲染失败：${error.message}`, true)
  }
}

function paintPreview(html, meta) {
  const frame = $('preview')
  // min-width:0 是必须的：flex 子项默认 min-width:auto，会被宽代码块撑开，
  // 居中对齐时两侧会被裁掉（左侧内容直接看不见）。
  frame.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><style>
    html,body{margin:0;padding:0;background:transparent;}
    body{display:flex;justify-content:center;}
    body>*{min-width:0;}
    pre{overflow-x:auto;}
  </style></head><body>${html}</body></html>`
  frame.style.background = meta?.background || '#ffffff'
  frame.style.borderRadius = '10px'
  frame.style.boxShadow = '0 2px 14px rgba(15,18,22,.10)'
}

/* ---------- 复制到公众号 ---------- */
async function copyToWeChat() {
  if (!currentHtml) return toast('还没有可复制的内容', true)
  const htmlBlob = new Blob([currentHtml], { type: 'text/html' })
  const textBlob = new Blob([currentPlain], { type: 'text/plain' })
  try {
    await navigator.clipboard.write([new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': textBlob })])
    toast('已复制，去公众号后台粘贴即可保留排版')
  } catch (error) {
    // 降级：浏览器不支持写入 text/html 时退回纯文本
    try {
      await navigator.clipboard.writeText(currentPlain)
      toast('当前浏览器不支持富文本复制，已复制纯文本', true)
    } catch {
      toast(`复制失败：${error.message}`, true)
    }
  }
}

/* ---------- 推送草稿 ---------- */
function openDraft() {
  if (!$('dTitle').value) $('dTitle').value = currentTitle()
  $('draftDialog').showModal()
}

async function submitDraft() {
  const payload = {
    appId: $('dAppId').value.trim(),
    appSecret: $('dAppSecret').value.trim(),
    title: $('dTitle').value.trim(),
    author: $('dAuthor').value.trim(),
    digest: $('dDigest').value.trim(),
    coverImageUrl: $('dCover').value.trim(),
    contentSourceUrl: $('dSource').value.trim(),
    markdown: editor.getValue(),
    theme: $('theme').value,
    fontSize: $('fontSize').value,
    backgroundType: $('background').value,
    codeTheme: $('codeTheme').value || undefined,
  }
  if (!payload.appId || !payload.appSecret) return toast('请填写 AppID 和 AppSecret', true)
  if (!payload.title) return toast('请填写标题', true)

  const button = $('btnDraftSubmit')
  button.disabled = true
  button.textContent = '推送中…'
  setStatus('正在上传图片并创建草稿…')
  try {
    const response = await fetch('/api/wechat/draft', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    })
    const result = await response.json()
    if (result.code !== 0) throw new Error(result.msg)
    const data = result.data
    toast(`草稿已创建（图片 ${data.uploadedImages} 张${data.failedImages.length ? `，失败 ${data.failedImages.length} 张` : ''}）。去公众号后台「草稿箱」查看。`)
    $('draftDialog').close()
    persist()
  } catch (error) {
    toast(`推送失败：${error.message}`, true)
  } finally {
    button.disabled = false
    button.textContent = '创建草稿'
    setStatus('就绪')
  }
}

/* ---------- 事件绑定 ---------- */
$('btnCopy').addEventListener('click', copyToWeChat)
$('btnDraft').addEventListener('click', openDraft)
$('btnDraftCancel').addEventListener('click', () => $('draftDialog').close())
$('btnDraftSubmit').addEventListener('click', submitDraft)
$('linkIp').addEventListener('click', async (event) => {
  event.preventDefault()
  const response = await fetch('/api/wechat/ip').then(r => r.json())
  toast(response.data?.ip ? `本机公网 IP：${response.data.ip}（加到公众号后台 IP 白名单）` : '无法获取公网 IP', !response.data?.ip)
})
for (const id of ['theme', 'fontSize', 'background', 'codeTheme'])
  $(id).addEventListener('change', render)
for (const id of ['dAppId', 'dAuthor'])
  $(id).addEventListener('change', persist)

// ⌘/Ctrl + S 复制到公众号
document.addEventListener('keydown', (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key === 's') {
    event.preventDefault()
    copyToWeChat()
  }
})

// 拖动分栏
;(() => {
  const divider = $('divider')
  const split = document.querySelector('.split')
  let dragging = false
  divider.addEventListener('mousedown', () => { dragging = true; document.body.style.userSelect = 'none' })
  window.addEventListener('mouseup', () => { dragging = false; document.body.style.userSelect = '' })
  window.addEventListener('mousemove', (event) => {
    if (!dragging) return
    const ratio = Math.min(0.85, Math.max(0.15, event.clientX / window.innerWidth))
    split.style.gridTemplateColumns = `${ratio}fr 6px ${1 - ratio}fr`
  })
})()

bootstrap().catch(error => toast(`初始化失败：${error.message}`, true))
</script>
</body>
</html>
